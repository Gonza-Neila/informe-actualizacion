name: Daily market update
on:
  schedule:
    - cron: '30 21 * * 1-5'   # weekdays, 30 minutes after the US close (winter time)
    - cron: '30 23 * * 1-5'   # second try in case the first one fails
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Update latest.json" && git push)
